name: Next App CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "apps/admin/**"
      - "apps/moplayer-dashboard/**"
      - "packages/shared/**"
      - "packages/db/**"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - "docs/**"
      - ".github/workflows/next-app-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/admin/**"
      - "apps/moplayer-dashboard/**"
      - "packages/shared/**"
      - "packages/db/**"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - "docs/**"
      - ".github/workflows/next-app-ci.yml"

jobs:
  verify:
    # Playwright 1.58 in this lockfile predates the ubuntu-latest 26.04 image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            prefix: apps/web
            run-tests: true
            run-lint: true
          - app: admin
            prefix: apps/admin
            run-tests: true
            run-lint: true
          - app: moplayer-dashboard
            prefix: apps/moplayer-dashboard
            run-tests: false
            run-lint: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces)
        run: npm ci

      - name: Lint
        if: matrix.run-lint
        run: npm --prefix ${{ matrix.prefix }} run lint

      - name: Typecheck
        run: npm --prefix ${{ matrix.prefix }} run typecheck

      - name: Unit tests
        if: matrix.run-tests
        run: npm --prefix ${{ matrix.prefix }} run test

      - name: MoOS download Worker HTTP and range tests
        if: matrix.app == 'web'
        run: node --test apps/web/cloudflare/moos-downloads/worker.test.mjs

      - name: Independent MoOS static export
        if: matrix.app == 'web'
        run: npm --prefix apps/web run build:moos-static

      - name: Build
        run: npm --prefix ${{ matrix.prefix }} run build

      - name: Install browser for public journeys
        if: matrix.app == 'web'
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium

      - name: Desktop and mobile browser journeys
        if: matrix.app == 'web'
        run: npm --prefix apps/web run test:e2e -- --workers=2
